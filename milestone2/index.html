<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const Component = () => {
            const { useState } = React;
            const [animals, setAnimals] = useState([
                'Leone',
                'Cane',
                'Cavallo',
                'Aquila',
                'Orso',
                'Gatto',
                'Elefante',
                'Tigre'
            ]);
            const animalsChoices = ["Cane", "Gatto", "Pappagallo", "Cavallo", "Panda"];

            const generateAnimal = () => {
                const randomIndex = Math.round(Math.random() * ((animalsChoices.length - 1) - 0) + 0);
                setAnimals([...animals, animalsChoices[randomIndex]]);
            }

            return (
                <details>
                    <summary>Animali</summary>
                    <div>
                        <button
                            onClick={generateAnimal}
                        >
                            Aggiungi Animale
                        </button>
                        {animals.map((a, i) => {
                            return (
                                <ul key={i}>
                                    <li>{a}</li>
                                </ul>
                            )
                        })}
                    </div>
                </details>
            )
        }

        const rootElement = document.querySelector('.lista-animali');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<Component />)
    </script>
</head>

<body>
    <header>
        <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali"></div>
    </main>
    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
</body>

</html>
